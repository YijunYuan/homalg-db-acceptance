schema_version: 1
concept: "cohomology"
summaries:
  - narrative_md: "The earlier paper connects semisimplicity and reflexivity (`Hochschild1942.Def_3_3`,
      `Hochschild1942.Thm_3_4`), with an associative derivation criterion (`Hochschild1942.Thm_2_2`, `Hochschild1942.Thm_3_2`).
      The later paper states its criterion through first cohomology: `Hochschild1945.Thm_4_1` characterizes
      separability by vanishing for every two-sided module. Its introduction explicitly describes the
      earlier result as a predecessor. This supports studying the change of language and ground-field
      scope, but does not establish an unrestricted theorem-equivalence edge. The supplied records contain
      editorial paraphrases and no Lean proofs."
